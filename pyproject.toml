[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "condition-pipeline"
version = "0.1.0"
description = "Pitcher condition pipeline: collect → baseline → delta → scoring → decision"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "pyarrow>=14.0",
  "pybaseball>=2.0.0,<3",
  "matplotlib>=3.10.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.4.0",
]
viz = [
  "matplotlib>=3.8",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools]
py-modules = [
  "pipeline",
  "config_paths",
  "artifacts",
  "collect",
  "split_pitchers",
  "filter_pitchers",
  "baseline",
  "condition_features",
  "outcome_features",
  "rolling_features",
  "labeling",
  "quadrant_analysis",
  "threshold_analysis",
  "aggregate",
  "scoring",
  "trend",
  "decision",
  "plots",
]
